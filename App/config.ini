; Default browser is first in list
; Use `{url}` to specify UWP app browser details
[browsers]
edge = C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
chrome = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" --new-window
ff = C:\Program Files\Mozilla Firefox\firefox.exe

; Url preferences.
; Only * is treated as a special character (wildcard).
; Matches are domain-only. Protocols and paths are ignored.
; Use "*.blah.com" for subdomains, not "*blah.com" as that would also match "abcblah.com".
[urls]
*.test.com = ff
test2.test.com = chrome

; ? symbols from both sides will match the whole URL (not only web site name)
?*teams.cdn.office.net/evergreen-assets/safelinks/1/atp-safelinks.html?url*atlassian.net*? = edge

; / symbols from both sides will match web site and path 
/(?:[0-9]{1,3}\.){3}[0-9]{1,3}/ = ff
; Default case. Added automatically
; * = whatever

[sources]
* - Notepad = ff
Slack | Test = chrome
*Microsoft Teams* = ff
*Microsoft Visual Studio* = ff

; Link-wrapper / safe-link unwrapping.
; When BrowseRouter receives a wrapped URL (e.g. an Outlook or Teams safe link), it
; extracts the real destination URL from the specified query parameter and re-runs the
; normal [urls] matching on it. This means you only need one [urls] rule per real
; domain, instead of one per wrapper variant.
;
; Format:  ?<wrapper-url-pattern>? = <query-param-name>
[wrappers]
; ?*teams.cdn.office.net/evergreen-assets/safelinks*? = url
; ?*outlook.office.com/mail/safelink*?                = url
; ?*safelinks.protection.outlook.com*?                = url

[settings]
; If set, the last 10 urls will be captured to this file.
; history_file = history.txt
; log = false

